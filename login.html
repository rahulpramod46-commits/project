<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exam Fee System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- BACKGROUND SLIDER --- */
        .bg-slider {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -3;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .active-slide {
            opacity: 1;
        }

        /* Brightness & Overlay */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7));
            z-index: -2;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 40px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .logo {
            height: 50px;
        }

        .nav a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- LOGIN CONTAINER --- */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
        }

        .container {
            width: 400px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container h3 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
            color: #fff;
        }

        .toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            margin-bottom: 25px;
            padding: 5px;
        }

        .toggle button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
        }

        .toggle button.active {
            background: #E74C3C;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #E74C3C;
        }

        input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            color: #333;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #E74C3C;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.3);
        }

        .login-btn:hover {
            background: #C0392B;
            transform: translateY(-3px);
        }

        .hidden {
            display: none;
        }

        .msg {
            color: #ffeb3b;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="bg-slider">
        <div class="slide active-slide"><img src="images/1.jpg">
        </div>
        <div class="slide"><img src="images/2.jpg">
        </div>
        <div class="slide"><img src="images/3.jpg">
        </div>
        <div class="slide"><img src="images/4.jpg">
        </div>
        <div class="slide"><img src="images/5.jpg">
        </div>
        <div class="slide"><img src="images/6.jpg">
        </div>
    </div>

    <div class="overlay"></div>

    <header class="header">
        <img src="pictures/logo.png" class="logo" alt="Logo">
        <nav class="nav">
            <a href="index.html" style="color: #2c3e50; text-decoration: none; font-weight: bold;"><i
                    class="fas fa-home"></i> Back to Home</a>
        </nav>
    </header>

    <div class="login-wrapper">
        <div class="container">
            <h3 id="loginHeader">Student Account Login</h3>

            <div class="toggle">
                <button id="adminBtn" onclick="showAdmin()">Admin</button>
                <button id="studentBtn" class="active" onclick="showStudent()">Student</button>
            </div>

            <div id="adminLogin" class="hidden">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input id="adminUser" placeholder="Admin Username">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input id="adminPass" type="password" placeholder="Admin Password">
                </div>
            </div>

            <div id="studentLogin">
                <div class="input-group">
                    <i class="fas fa-id-card"></i>
                    <input id="rollNo" placeholder="Enter Roll Number">
                </div>
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input id="studentPass" type="password" placeholder="Enter Password (DOB)">
                </div>
            </div>

            <button class="login-btn" onclick="login()">Login Now</button>
            <div class="msg" id="msg"></div>
        </div>
    </div>

    <script>
        // BACKGROUND SLIDER LOGIC
        let slides = document.querySelectorAll(".slide");
        let idx = 0;
        setInterval(() => {
            slides[idx].classList.remove("active-slide");
            idx = (idx + 1) % slides.length;
            slides[idx].classList.add("active-slide");
        }, 5000);

        function showAdmin() {
            document.getElementById("adminLogin").classList.remove("hidden");
            document.getElementById("studentLogin").classList.add("hidden");
            document.getElementById("adminBtn").classList.add("active");
            document.getElementById("studentBtn").classList.remove("active");
            document.getElementById("loginHeader").innerText = "Admin Login";
            document.getElementById("msg").innerText = "";
        }

        function showStudent() {
            document.getElementById("adminLogin").classList.add("hidden");
            document.getElementById("studentLogin").classList.remove("hidden");
            document.getElementById("studentBtn").classList.add("active");
            document.getElementById("adminBtn").classList.remove("active");
            document.getElementById("loginHeader").innerText = "Student Account Login";
            document.getElementById("msg").innerText = "";
        }
        async function login() {
            const msg = document.getElementById("msg");
            const isAdminActive = !document.getElementById("adminLogin").classList.contains("hidden");

            if (isAdminActive) {
                // --- Admin Login (Static) ---
                const user = document.getElementById("adminUser").value;
                const pass = document.getElementById("adminPass").value;

                if (user === "Rahul" && pass === "rahul04") {
                    window.location.href = "Admin.html";
                } else {
                    msg.innerText = "❌ Invalid Admin Credentials";
                    msg.style.color = "yellow";
                }
            } else {
                // --- Student Login using Backend API ---
                const roll = document.getElementById("rollNo").value.trim().toUpperCase();
                const pass = document.getElementById("studentPass").value.trim();

                if (!roll || !pass) {
                    msg.innerText = "❌ Please enter Roll No and Password";
                    msg.style.color = "yellow";
                    return;
                }

                try {
                    // Calling the Node.js Backend API (Updated URL and Body)
                    const response = await fetch('http://localhost:3000/api/student-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            roll_no: roll,
                            password: pass // Server.js లో 'password' అని ఉంది కాబట్టి ఇక్కడ కూడా అలాగే పంపాలి
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Success: Save the specific student data to localStorage for Student Dashboard
                        localStorage.setItem("loggedInStudent", JSON.stringify(result.student));
                        window.location.href = "Student.html";
                    } else {
                        // Failure: Show error message from server
                        msg.innerText = "❌ " + result.message;
                        msg.style.color = "yellow";
                    }
                } catch (error) {
                    console.error("Error:", error);
                    msg.innerText = "❌ Server Error! Please start 'node server.js'";
                    msg.style.color = "red";
                }
            }
        }
    </script>
</body>

</html>
